# Dinner sensors - based on fixed weekly schedule
# Mon=Kätlyn, Tue=Lola, Wed=Eero, Thu=Lola, Fri=Kätlyn, Sat=Eero, Sun=Kätlyn

template:
  - sensor:
      - name: Dinner Today
        unique_id: dinner_today_sensor
        icon: mdi:silverware-fork-knife
        state: >
          {% set weekday = now().weekday() %}
          {% set schedule = {
            0: 'Kätlyn',
            1: 'Lola',
            2: 'Eero',
            3: 'Lola',
            4: 'Kätlyn',
            5: 'Eero',
            6: 'Kätlyn'
          } %}
          {{ schedule.get(weekday, 'Unknown') }}
        attributes:
          person_id: >
            {% set weekday = now().weekday() %}
            {% set schedule = {
              0: 'person.katlyn_otsus',
              1: 'person.lola_laur',
              2: 'person.eero_otsus',
              3: 'person.lola_laur',
              4: 'person.katlyn_otsus',
              5: 'person.eero_otsus',
              6: 'person.katlyn_otsus'
            } %}
            {{ schedule.get(weekday, '') }}

      - name: Dinner Tomorrow
        unique_id: dinner_tomorrow_sensor
        icon: mdi:silverware-fork-knife
        state: >
          {% set weekday = (now().weekday() + 1) % 7 %}
          {% set schedule = {
            0: 'Kätlyn',
            1: 'Lola',
            2: 'Eero',
            3: 'Lola',
            4: 'Kätlyn',
            5: 'Eero',
            6: 'Kätlyn'
          } %}
          {{ schedule.get(weekday, 'Unknown') }}
        attributes:
          person_id: >
            {% set weekday = (now().weekday() + 1) % 7 %}
            {% set schedule = {
              0: 'person.katlyn_otsus',
              1: 'person.lola_laur',
              2: 'person.eero_otsus',
              3: 'person.lola_laur',
              4: 'person.katlyn_otsus',
              5: 'person.eero_otsus',
              6: 'person.katlyn_otsus'
            } %}
            {{ schedule.get(weekday, '') }}
