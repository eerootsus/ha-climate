# Ada care sensors - alternates daily between Eero and Kätlyn
# Reference date: 2026-04-03 (Eero starts on even days, Kätlyn on odd days)

template:
  - sensor:
      - name: Ada Care Today
        unique_id: ada_care_today_sensor
        icon: mdi:baby-face-outline
        state: >
          {% set ref = today_at('00:00').replace(year=2026, month=4, day=3) %}
          {% set days = (today_at('00:00') - ref).days %}
          {{ 'Eero' if days % 2 == 0 else 'Kätlyn' }}
        attributes:
          notify_service: >
            {% set ref = today_at('00:00').replace(year=2026, month=4, day=3) %}
            {% set days = (today_at('00:00') - ref).days %}
            {{ 'notify.mobile_app_eeros_iphone_17' if days % 2 == 0 else 'notify.mobile_app_katu_iphone' }}

