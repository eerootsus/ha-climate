template:
  - sensor:
      - name: Chore Laundry
        unique_id: chore_laundry_sensor
        icon: mdi:washing-machine
        state: >
          {% set person = states('input_select.chore_laundry') %}
          {% set names = {
            'person.eero_otsus': 'Eero',
            'person.katlyn_otsus': 'Kätlyn',
            'person.lola_laur': 'Lola'
          } %}
          {% set base_name = names.get(person, 'Unknown') %}
          {% set ada_eero = states('input_select.ada_helper_eero') %}
          {% set ada_katlyn = states('input_select.ada_helper_katlyn') %}
          {% set ada_lola = states('input_select.ada_helper_lola') %}
          {% if ada_eero == 'chore_laundry' or ada_katlyn == 'chore_laundry' or ada_lola == 'chore_laundry' %}
            {{ base_name }} & Ada
          {% else %}
            {{ base_name }}
          {% endif %}
        attributes:
          person_id: "{{ states('input_select.chore_laundry') }}"
          ada_helping: "{{ states('input_select.ada_helper_eero') == 'chore_laundry' or states('input_select.ada_helper_katlyn') == 'chore_laundry' or states('input_select.ada_helper_lola') == 'chore_laundry' }}"

