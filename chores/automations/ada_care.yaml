# Daily Ada care reminder - 07:00
# Notifies today's caregiver based on alternating schedule (Eero/Kätlyn)

automation:
  - id: chore_ada_care_reminder
    alias: "Chores: Ada Care Reminder"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - service: "{{ state_attr('sensor.ada_care_today', 'notify_service') }}"
        data:
          title: "Ada päev"
          message: "{{ states('sensor.ada_care_today') }}, sinu kord on täna Ada eest hoolitseda!"
