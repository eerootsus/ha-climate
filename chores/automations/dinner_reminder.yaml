# Daily dinner reminder - 10:00
# Notifies today's cook based on fixed weekly schedule

automation:
  - id: chore_dinner_reminder
    alias: "Chores: Daily Dinner Reminder"
    trigger:
      - platform: time
        at: "10:00:00"
    action:
      - choose:
          # Monday - Kätlyn
          - conditions:
              - condition: time
                weekday:
                  - mon
            sequence:
              - service: notify.mobile_app_katu_iphone
                data:
                  title: "Köögitoimkond"
                  message: "Kätlyn, sinu kord on täna õhtusöök valmistada!"

          # Tuesday - Lola
          - conditions:
              - condition: time
                weekday:
                  - tue
            sequence:
              - service: notify.mobile_app_lolas_iphone
                data:
                  title: "Köögitoimkond"
                  message: "Lola, sinu kord on täna õhtusöök valmistada!"

          # Wednesday - Eero
          - conditions:
              - condition: time
                weekday:
                  - wed
            sequence:
              - service: notify.mobile_app_eeros_iphone
                data:
                  title: "Köögitoimkond"
                  message: "Eero, sinu kord on täna õhtusöök valmistada!"

          # Thursday - Lola
          - conditions:
              - condition: time
                weekday:
                  - thu
            sequence:
              - service: notify.mobile_app_lolas_iphone
                data:
                  title: "Köögitoimkond"
                  message: "Lola, sinu kord on täna õhtusöök valmistada!"

          # Friday - Kätlyn
          - conditions:
              - condition: time
                weekday:
                  - fri
            sequence:
              - service: notify.mobile_app_katu_iphone
                data:
                  title: "Köögitoimkond"
                  message: "Kätlyn, sinu kord on täna õhtusöök valmistada!"

          # Saturday - Eero
          - conditions:
              - condition: time
                weekday:
                  - sat
            sequence:
              - service: notify.mobile_app_eeros_iphone
                data:
                  title: "Köögitoimkond"
                  message: "Eero, sinu kord on täna õhtusöök valmistada!"

          # Sunday - Kätlyn
          - conditions:
              - condition: time
                weekday:
                  - sun
            sequence:
              - service: notify.mobile_app_katu_iphone
                data:
                  title: "Köögitoimkond"
                  message: "Kätlyn, sinu kord on täna õhtusöök valmistada!"
