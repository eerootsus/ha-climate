# Saturday cleaning day reminder - Saturday at 10:00
# Reminds everyone that today is cleaning day with their assigned chores

automation:
  - id: chore_cleaning_day
    alias: "Chores: Cleaning Day Reminder"
    trigger:
      - platform: time
        at: "10:00:00"
    condition:
      - condition: time
        weekday:
          - sat
    action:
      # Notify Eero
      - service: notify.mobile_app_eeros_iphone
        data:
          title: "Koristuspäev!"
          message: "Täna on koristuspäev!"

      # Notify Kätlyn
      - service: notify.mobile_app_katu_iphone
        data:
          title: "Koristuspäev!"
          message: "Täna on koristuspäev!"

      # Notify Lola
      - service: notify.mobile_app_lolas_iphone
        data:
          title: "Koristuspäev!"
          message: "Täna on koristuspäev!"

      # Notify Ada
      - service: notify.mobile_app_adas_iphone
        data:
          title: "Koristuspäev!"
          message: "Täna on koristuspäev!"
