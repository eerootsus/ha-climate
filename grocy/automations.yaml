# Grocy Automations

- alias: "Weekly chore rotation"
  id: grocy_weekly_chore_rotation
  description: "Execute rotating chores every Monday to trigger user rotation"
  trigger:
    - platform: time
      at: "00:01:00"
  condition:
    - condition: time
      weekday:
        - mon
  action:
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 3
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 4
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 5
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 6
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 7
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 8
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 16
    - delay: "00:00:05"
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.grocy_chores_raw

- alias: "Daily dinner reminder"
  id: grocy_daily_dinner_reminder
  description: "Notify today's cook at 10:00"
  trigger:
    - platform: time
      at: "10:00:00"
  action:
    - variables:
        cook: "{{ states('sensor.dinner_today') }}"
        notify_services:
          Eero: notify.mobile_app_fp5
          Kätlyn: notify.mobile_app_katu_iphone
          Lola: ""
        notify_service: "{{ notify_services.get(cook, '') }}"
    - condition: template
      value_template: "{{ notify_service != '' }}"
    - service: "{{ notify_service }}"
      data:
        title: "Köögitoimkond"
        message: "Sina oled täna õhtusöögi tegija!"

- alias: "Weekly chore notification"
  id: grocy_weekly_chore_notification
  description: "Notify each person their weekly chores on Monday at 08:00"
  trigger:
    - platform: time
      at: "08:00:00"
  condition:
    - condition: time
      weekday:
        - mon
  action:
    - repeat:
        for_each:
          - name: Eero
            notify_service: notify.mobile_app_fp5
          - name: Kätlyn
            notify_service: notify.mobile_app_katu_iphone
          - name: Lola
            notify_service: ""
        sequence:
          - variables:
              chores: >
                {% set chore_map = {
                  'chore_laundry': 'Pesutoimkond',
                  'chore_trash': 'Prügitoimkond',
                  'chore_bathroom': 'Tualetitoimkond',
                  'chore_plants': 'Floratoimkond',
                  'chore_cat': 'Kassitoimkond',
                  'chore_outdoor': 'Õuetoimkond',
                  'chore_dust': 'Tolmutoimkond'
                } %}
                {% set ns = namespace(list=[]) %}
                {% for sensor_id, display_name in chore_map.items() %}
                  {% if states('sensor.' ~ sensor_id) == repeat.item.name %}
                    {% set ns.list = ns.list + [display_name] %}
                  {% endif %}
                {% endfor %}
                {{ ns.list | join(', ') }}
          - condition: template
            value_template: "{{ chores | length > 0 and repeat.item.notify_service != '' }}"
          - service: "{{ repeat.item.notify_service }}"
            data:
              title: "Sel nädalal sinu toimkonnad"
              message: "{{ chores }}"
