# Grocy Automations

- alias: "Weekly chore rotation"
  id: grocy_weekly_chore_rotation
  description: "Execute rotating chores every Monday to trigger user rotation"
  trigger:
    - platform: time
      at: "00:01:00"
  condition:
    - condition: time
      weekday:
        - mon
  action:
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 3
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 4
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 5
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 6
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 7
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 8
    - delay: "00:00:02"
    - service: rest_command.execute_grocy_chore
      data:
        chore_id: 16
    - delay: "00:00:05"
    - service: homeassistant.update_entity
      target:
        entity_id: sensor.grocy_chores_raw

- alias: "Daily dinner reminder"
  id: grocy_daily_dinner_reminder
  description: "Notify today's cook at 10:00"
  trigger:
    - platform: time
      at: "10:00:00"
  action:
    - variables:
        cook: "{{ states('sensor.dinner_today') }}"
        people:
          Eero: person.eero_otsus
          Kätlyn: person.katlyn_otsus
          Lola: person.lola_laur
        person_id: "{{ people.get(cook, '') }}"
        notify_service: >
          {% if person_id %}
            {% set trackers = state_attr(person_id, 'device_trackers') | default([]) %}
            {% for tracker in trackers %}
              {% set device = tracker.replace('device_tracker.', '') %}
              {% set service = 'notify.mobile_app_' ~ device %}
              {% if states(service) is defined and states(service) != 'unknown' %}
                {{ service }}
              {% endif %}
            {% endfor %}
          {% endif %}
    - condition: template
      value_template: "{{ notify_service | trim != '' }}"
    - service: "{{ notify_service | trim }}"
      data:
        title: "Köögitoimkond"
        message: "Sina oled täna õhtusöögi tegija!"

- alias: "Weekly chore notification"
  id: grocy_weekly_chore_notification
  description: "Notify each person their weekly chores on Monday at 08:00"
  trigger:
    - platform: time
      at: "08:00:00"
  condition:
    - condition: time
      weekday:
        - mon
  action:
    - repeat:
        for_each:
          - name: Eero
            person_id: person.eero_otsus
          - name: Kätlyn
            person_id: person.katlyn_otsus
          - name: Lola
            person_id: person.lola_laur
        sequence:
          - variables:
              chores: >
                {% set chore_map = {
                  'chore_laundry': 'Pesutoimkond',
                  'chore_trash': 'Prügitoimkond',
                  'chore_bathroom': 'Tualetitoimkond',
                  'chore_plants': 'Floratoimkond',
                  'chore_cat': 'Kassitoimkond',
                  'chore_outdoor': 'Õuetoimkond',
                  'chore_dust': 'Tolmutoimkond'
                } %}
                {% set ns = namespace(list=[]) %}
                {% for sensor_id, display_name in chore_map.items() %}
                  {% if states('sensor.' ~ sensor_id) == repeat.item.name %}
                    {% set ns.list = ns.list + [display_name] %}
                  {% endif %}
                {% endfor %}
                {{ ns.list | join(', ') }}
              notify_service: >
                {% set trackers = state_attr(repeat.item.person_id, 'device_trackers') | default([]) %}
                {% for tracker in trackers %}
                  {% set device = tracker.replace('device_tracker.', '') %}
                  {% set service = 'notify.mobile_app_' ~ device %}
                  {% if states(service) is defined and states(service) != 'unknown' %}
                    {{ service }}
                  {% endif %}
                {% endfor %}
          - condition: template
            value_template: "{{ chores | length > 0 and notify_service | trim != '' }}"
          - service: "{{ notify_service | trim }}"
            data:
              title: "Sel nädalal sinu toimkonnad"
              message: "{{ chores }}"
