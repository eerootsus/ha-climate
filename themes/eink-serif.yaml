eink-serif:
  modes:
    light:
      # Serif font stack (new HA 2025.5+ variables)
      ha-font-family-body: "'Georgia', 'Times New Roman', 'Palatino Linotype', serif"
      ha-font-family-heading: "'Georgia', 'Times New Roman', 'Palatino Linotype', serif"
      ha-font-family-longform: "'Georgia', 'Times New Roman', 'Palatino Linotype', serif"
      ha-font-family-code: "'Courier New', monospace"

      # Font size scale multiplier (1.0 = default, 1.15 = 15% larger)
      ha-font-size-scale: "1.15"

      # Individual font sizes
      ha-font-size-2xs: "11px"
      ha-font-size-xs: "13px"
      ha-font-size-s: "15px"
      ha-font-size-m: "17px"
      ha-font-size-l: "20px"
      ha-font-size-xl: "24px"
      ha-font-size-2xl: "30px"
      ha-font-size-3xl: "36px"
      ha-font-size-4xl: "44px"

      # Card header
      ha-card-header-font-size: "24px"

      # E-ink optimized colors (high contrast grayscale)
      primary-color: "#000000"
      primary-background-color: "#FFFFFF"
      secondary-background-color: "#F5F5F5"
      card-background-color: "#FFFFFF"
      primary-text-color: "#000000"
      secondary-text-color: "#333333"
      disabled-text-color: "#666666"
      divider-color: "#CCCCCC"
